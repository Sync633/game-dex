name: Pipeline CD - GameDex (AT2)

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: 1. Integração Contínua (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependências do backend
        working-directory: backend
        run: pnpm install

      - name: Validar ESLint
        working-directory: backend
        run: pnpm run lint

      - name: Checagem de tipos (tsc --noEmit)
        working-directory: backend
        run: pnpm run typecheck

      - name: Compilar projeto (build)
        working-directory: backend
        run: pnpm run build

  docker-build:
    name: 2. Validação do Contêiner Docker (CD)
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Construir imagem Docker de produção
        run: docker build -t gamedex-api:${{ github.sha }} ./backend

  deploy:
    name: 3. Deploy Contínuo no Render (Webhook)
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Disparar Deploy Hook do Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Erro: Secret RENDER_DEPLOY_HOOK_URL não configurado."
            exit 1
          fi

          HTTP_STATUS=$(curl -sS -o /tmp/render_response.txt -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "Status HTTP retornado pelo Render: $HTTP_STATUS"
          cat /tmp/render_response.txt
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
            echo "Falha ao acionar o Deploy Hook do Render (HTTP $HTTP_STATUS)."
            exit 1
          fi

          echo "Deploy no Render acionado com sucesso."

      - name: Resumo do Deploy
        run: |
          echo "### Pipeline CI/CD (AT2) concluído com sucesso" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Autor: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY